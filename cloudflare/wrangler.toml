name = "lshorter-api"
main = "worker-kv.js"
compatibility_date = "2024-09-01"

# Route and Custom Domain on lsho.cc
routes = [
  { pattern = "lsho.cc/*", custom_domain = true },
  { pattern = "api.lsho.cc/*", custom_domain = true }
]

# 1. Cloudflare KV Namespace for Ultra-Fast Link Lookups
[[kv_namespaces]]
binding = "LINKS_KV"
id = "YOUR_KV_NAMESPACE_ID_HERE"
preview_id = "YOUR_KV_PREVIEW_ID_HERE"

# 2. Cloudflare D1 Database for Relational & Analytics Storage
[[d1_databases]]
binding = "DB"
database_name = "lshorter-db"
database_id = "YOUR_D1_DATABASE_ID_HERE"
